<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappia · Sua conta</title>
<link rel="stylesheet" href="css/mappia.css?v=6">
</head><body class="mappia">
<main class="app">
<header class="topbar"><a class="logo" href="index.html" aria-label="Mappia, página inicial">mappia<span>.</span></a><a class="btn-entrar" href="index.html">Voltar ao mapa</a></header>
<p class="apresentacao" data-apresentacao hidden>Modo apresentação · dados de teste</p>
<section class="workspace-panel"><h1>Sua conta</h1><p class="intro-copy">Guarde os protocolos de teste e acompanhe o andamento dos relatos.</p>
<div class="account-modes" aria-label="Opções de conta">
<button type="button" class="chip active" id="modo-entrar" aria-pressed="true">Entrar</button>
<button type="button" class="chip" id="modo-cadastro" aria-pressed="false">Criar conta</button>
</div>
<form class="workspace-form" id="form-conta">
<label for="conta-email">E-mail fictício</label>
<input type="email" id="conta-email" name="email" required autocomplete="username" placeholder="morador@example.com">
<label for="conta-senha">Senha de teste</label>
<input type="password" id="conta-senha" name="senha" minlength="6" required autocomplete="current-password">
<button class="primary" type="submit" id="conta-enviar">Entrar</button>
<p id="conta-status" role="status"></p>
</form></section></main>
<script type="module" src="js/base.mjs"></script><script type="module" src="js/conta.mjs"></script>
</body></html>
