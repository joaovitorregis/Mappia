<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mappia – Início</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- CSS único (inclui os ícones do Bootstrap) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/mappia.css?v=6">
</head>

<body class="mappia pagina-inicio">
  <main class="app">

    <!--cabeça do site-->
    <header class="topbar">
      <a href="index.html?v=5" class="logo" aria-label="Mappia, página inicial">mappia<span>.</span></a>

      <a href="conta.html" class="btn-entrar" data-conta>
        <!--class do bootstrap-->
        <i class="bi bi-person icone" aria-hidden="true"></i>
        Entrar
      </a>
    </header>
    <p class="apresentacao" data-apresentacao hidden>Modo apresentação · dados de teste</p>

    <!--barra de navegação-->
    <nav class="tabs" aria-label="Seções do aplicativo">
      <a href="index.html?v=5" class="tab active" aria-current="page">Mapa</a>
      <a href="relatar.html?v=5" class="tab">Relatar</a>
      <a href="acompanhar.html?v=5" class="tab">Acompanhar</a>
    </nav>

    <!--meio da tela-->
    <section class="hero">
      <p class="local">
        <i class="bi bi-geo-alt-fill icone" aria-hidden="true"></i>
        <span id="cidade">Campina Grande</span>
      </p>

      <h1 class="titulo">Seu bairro,<br>mais <span class="destaque">visível.</span></h1>

      <p class="subtitulo">Viu algo que precisa de atenção? Conte aqui.</p>

      <a href="relatar.html?v=5" class="btn-primary" id="btn-relatar">
        <span class="btn-conteudo">
          <i class="bi bi-plus-circle icone" aria-hidden="true"></i>
          Relatar um problema
        </span>
        <i class="bi bi-arrow-right icone" aria-hidden="true"></i>
      </a>
    </section>

    <section class="mapa-publico" aria-label="Ocorrências públicas">
      <ul class="map-counts" aria-label="Contagem de ocorrências">
        <li><strong data-contagem="validada">—</strong> Validadas</li>
        <li><strong data-contagem="encaminhada">—</strong> Encaminhadas</li>
        <li><strong data-contagem="resolvida">—</strong> Resolvidas</li>
      </ul>
      <div class="filtros" id="map-filters" aria-label="Filtrar por categoria"></div>
      <div class="mapa-container"><div id="mapa" class="mapa mapa-interativo" aria-label="Mapa público de Campina Grande"></div></div>
      <button type="button" class="text-button" id="btn-localizacao">Usar minha localização</button>
      <p id="map-gps" role="status"></p>
      <p id="map-status" role="status"></p>
      <button type="button" class="secondary" id="map-retry" hidden>Tentar de novo</button>
    </section>

  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/base.mjs"></script>
  <script type="module" src="js/mapa-publico.mjs"></script>
</body>
</html>
